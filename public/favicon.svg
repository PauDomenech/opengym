<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <!-- Matte Black Background with rounded corners -->
  <rect width="512" height="512" rx="112" fill="#111318" />
  
  <!-- Minimalist Barbell Top Half (Electric Royal Blue) -->
  <g fill="#2563EB">
    <!-- Center Bar Top -->
    <rect x="180" y="240" width="152" height="16" />
    
    <!-- Left Inner Collar Top -->
    <rect x="136" y="160" width="40" height="96" rx="16" />
    <!-- Left Outer Plate Top -->
    <rect x="76" y="190" width="44" height="66" rx="14" />
    
    <!-- Right Inner Collar Top -->
    <rect x="336" y="160" width="40" height="96" rx="16" />
    <!-- Right Outer Plate Top -->
    <rect x="392" y="190" width="44" height="66" rx="14" />
  </g>

  <!-- Minimalist Barbell Bottom Half (Pure Crisp White) -->
  <g fill="#FFFFFF">
    <!-- Center Bar Bottom -->
    <rect x="180" y="256" width="152" height="16" />
    
    <!-- Left Inner Collar Bottom -->
    <rect x="136" y="256" width="40" height="96" rx="16" />
    <!-- Left Outer Plate Bottom -->
    <rect x="76" y="256" width="44" height="66" rx="14" />
    
    <!-- Right Inner Collar Bottom -->
    <rect x="336" y="256" width="40" height="96" rx="16" />
    <!-- Right Outer Plate Bottom -->
    <rect x="392" y="256" width="44" height="66" rx="14" />
  </g>

  <!-- Subtle dividing line / contrast -->
  <line x1="76" y1="256" x2="436" y2="256" stroke="#111318" stroke-width="3" />
</svg>
